name: Quadio
options:
  bundleIdPrefix: com.samroman
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.10
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  Quadio:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Quadio
      - path: Bridge
      - path: Vendor
        excludes:
          - "**/*.md"
    resources:
      - path: Quadio/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samroman.quadio
        PRODUCT_NAME: Quadio
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Quadio
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIBackgroundModes:
          - audio
          - fetch
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Quadio discovers nearby devices to route decoded QS channels over your local network.
        INFOPLIST_KEY_NSBonjourServices:
          - _quadio._udp
        SWIFT_OBJC_BRIDGING_HEADER: Quadio/Quadio-Bridging-Header.h
    info:
      path: Quadio/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  QuadioTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: QuadioTests
    dependencies:
      - target: Quadio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samroman.quadio.tests
        GENERATE_INFOPLIST_FILE: YES
